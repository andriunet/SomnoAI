# Despliegue en EC2: el tablero y la API se sirven por el mismo puerto (8050).
# Así el navegador no necesita un segundo puerto abierto en el security group
# y desaparece el problema de CORS.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;      # un análisis real de un EDF tarda minutos
        proxy_send_timeout 600s;
        client_max_body_size 700M;    # el tablero admite archivos de hasta 600 MB
    }


    # Documentación interactiva de la API (Swagger) por el mismo puerto
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / { try_files $uri $uri/ /index.html; }
}
