# Tox automatiza entrenamiento y pruebas en entornos virtuales aislados, para que
# el resultado no dependa de lo que haya instalado en la maquina.
#
#   tox run -e train           entrena el artefacto y lo deja en edad_cerebral/trained/
#   tox run -e test_package    corre las pruebas del paquete
#   tox run -e typechecks      mypy
#
# El entorno train no necesita rutas: las tablas de caracteristicas y la particion
# viajan dentro del paquete, en edad_cerebral/datasets/.

[tox]
min_version = 4
envlist = test_package
skipsdist = True

[testenv]
install_command = pip install {opts} {packages}

[testenv:train]
deps = -rrequirements/requirements.txt
setenv =
    PYTHONPATH = .
    PYTHONHASHSEED = 0
commands = python -m edad_cerebral.train_pipeline

[testenv:test_package]
deps = -rrequirements/test_requirements.txt
setenv =
    PYTHONPATH = .
    PYTHONHASHSEED = 0
commands =
    python -m edad_cerebral.train_pipeline
    pytest -v {posargs:tests}

[testenv:typechecks]
deps = -rrequirements/typing_requirements.txt
setenv =
    PYTHONPATH = .
commands = mypy edad_cerebral
